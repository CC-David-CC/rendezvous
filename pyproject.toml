[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-rendezvous"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["webos-accounts==0.1.0", "cryptography==46.0.7", "websockets==17.1"]

[tool.setuptools.packages.find]
where = ["src"]
